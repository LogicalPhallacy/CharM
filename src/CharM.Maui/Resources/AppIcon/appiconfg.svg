<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- App icon FOREGROUND layer: the d20 glyph, centered in a SQUARE viewBox so
     MAUI's Resizetizer rasterizes it cleanly and Android's adaptive mask keeps
     it centered. Cleaned from the original Inkscape export: dropped the
     inkscape/sodipodi namespaces, <inkscape:path-effect> defs, <metadata>,
     <sodipodi:namedview>, the two invisible fill-opacity:0 trailing paths, and
     the shared translate() (the userSpaceOnUse gradients share the glyph's
     coordinate space, so removing a common ancestor translate preserves their
     alignment). Pair with ForegroundScale in the .csproj to fit the safe zone. -->
