<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- App icon BACKGROUND layer. MAUI composes this beneath the foreground and,
     on Android, uses it as the adaptive-icon background. It must be a simple,
     full-bleed SQUARE so every launcher mask (circle / squircle / rounded)
     crops cleanly. The d20 glyph lives in appiconfg.svg (the foreground). -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456" version="1.1">
  <rect x="0" y="0" width="456" height="456" fill="#FFD700" />
</svg>